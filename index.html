<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>When Am I UpDog? &mdash; Personal Schedule</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-subtle: #f1f5f9;
      --border: #e2e8f0;
      --border-subtle: #f1f5f9;
      --text: #0f172a;
      --text-muted: #64748b;
      --text-faint: #94a3b8;
      --primary: #0f172a;
      --primary-fg: #f8fafc;
      --accent: #2563eb;
      
      --field1-bg: #eff6ff;
      --field1-text: #1d4ed8;
      --field1-border: #bfdbfe;
      
      --field2-bg: #f5f3ff;
      --field2-text: #6d28d9;
      --field2-border: #ddd6fe;
      
      --field3-bg: #ecfdf5;
      --field3-text: #047857;
      --field3-border: #a7f3d0;
      
      --field23-bg: #fff7ed;
      --field23-text: #c2410c;
      --field23-border: #fed7aa;
      
      --warning-bg: #fef2f2;
      --warning-text: #b91c1c;
      --warning-border: #fecaca;
      
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      --radius: 12px;
      --radius-sm: 8px;
      --radius-full: 9999px;
    }

    [data-theme="dark"] {
      --bg: #09090b;
      --surface: #121215;
      --surface-subtle: #18181b;
      --border: #27272a;
      --border-subtle: #1e1e24;
      --text: #f4f4f5;
      --text-muted: #a1a1aa;
      --text-faint: #71717a;
      --primary: #f4f4f5;
      --primary-fg: #09090b;
      --accent: #3b82f6;
      
      --field1-bg: rgba(30, 58, 138, 0.25);
      --field1-text: #93c5fd;
      --field1-border: rgba(59, 130, 246, 0.3);
      
      --field2-bg: rgba(76, 29, 149, 0.25);
      --field2-text: #c4b5fd;
      --field2-border: rgba(139, 92, 246, 0.3);
      
      --field3-bg: rgba(6, 78, 59, 0.25);
      --field3-text: #6ee7b7;
      --field3-border: rgba(16, 185, 129, 0.3);
      
      --field23-bg: rgba(124, 45, 18, 0.25);
      --field23-text: #fdba74;
      --field23-border: rgba(249, 115, 22, 0.3);
      
      --warning-bg: rgba(127, 29, 29, 0.3);
      --warning-text: #fca5a5;
      --warning-border: rgba(239, 68, 68, 0.35);
      
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.5);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0.85rem 1.25rem;
    }

    .header-inner {
      max-width: 680px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      text-decoration: none;
      color: var(--text);
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: -0.02em;
    }

    .brand-icon {
      width: 28px;
      height: 28px;
      border-radius: var(--radius-sm);
      background: var(--primary);
      color: var(--primary-fg);
      display: grid;
      place-items: center;
      font-size: 0.85rem;
      flex-shrink: 0;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.72rem;
      font-weight: 500;
      padding: 0.22rem 0.65rem;
      border-radius: var(--radius-full);
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      color: var(--text-muted);
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10b981;
      display: inline-block;
    }

    .badge-dot.syncing {
      background: #f59e0b;
      animation: pulse 1s infinite;
    }

    .badge-dot.error {
      background: #ef4444;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.8); }
    }

    .btn-icon {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      cursor: pointer;
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      display: grid;
      place-items: center;
      transition: all 0.15s ease;
    }

    .btn-icon:hover {
      background: var(--surface-subtle);
      color: var(--text);
      border-color: var(--text-muted);
    }

    .btn-icon.spinning svg {
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    main {
      flex: 1;
      max-width: 680px;
      width: 100%;
      margin: 0 auto;
      padding: 1.5rem 1.25rem 4rem;
    }

    .loading-state {
      text-align: center;
      padding: 4rem 1.5rem;
      color: var(--text-muted);
    }

    .loading-spinner {
      width: 28px;
      height: 28px;
      border: 2.5px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      margin: 0 auto 1rem;
      animation: spin 0.7s linear infinite;
    }

    .search-section {
      margin-bottom: 1.5rem;
      position: relative;
    }

    .search-box {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-icon {
      position: absolute;
      left: 1rem;
      color: var(--text-faint);
      pointer-events: none;
      width: 18px;
      height: 18px;
    }

    .search-input {
      width: 100%;
      padding: 0.85rem 2.75rem 0.85rem 2.65rem;
      font-size: 0.95rem;
      font-family: inherit;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      outline: none;
      transition: all 0.2s ease;
    }

    .search-input:focus {
      border-color: var(--text);
      box-shadow: 0 0 0 1px var(--text), var(--shadow-sm);
    }

    .search-clear {
      position: absolute;
      right: 0.75rem;
      background: none;
      border: none;
      color: var(--text-faint);
      cursor: pointer;
      padding: 0.25rem;
      display: none;
    }

    .search-clear:hover {
      color: var(--text);
    }

    .suggestions-list {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      z-index: 40;
      max-height: 280px;
      overflow-y: auto;
      list-style: none;
      display: none;
    }

    .suggestion-item {
      padding: 0.7rem 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-subtle);
      font-size: 0.9rem;
      transition: background-color 0.1s ease;
    }

    .suggestion-item:last-child {
      border-bottom: none;
    }

    .suggestion-item:hover {
      background: var(--surface-subtle);
    }

    .suggestion-name {
      font-weight: 500;
      color: var(--text);
    }

    .suggestion-meta {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .profile-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      margin-bottom: 1.5rem;
      box-shadow: var(--shadow-sm);
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .profile-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 0.85rem;
    }

    .profile-title {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    .profile-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.35rem;
    }

    .stat-chip {
      font-size: 0.78rem;
      color: var(--text-muted);
      background: var(--surface-subtle);
      padding: 0.2rem 0.55rem;
      border-radius: var(--radius-sm);
      font-weight: 500;
    }

    .filter-section {
      padding-top: 0.85rem;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }

    .filter-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    .filter-label {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-faint);
      margin-right: 0.25rem;
      min-width: 44px;
    }

    .filter-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 500;
      padding: 0.3rem 0.7rem;
      border-radius: var(--radius-full);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.15s ease;
    }

    .filter-btn:hover {
      background: var(--surface-subtle);
      color: var(--text);
    }

    .filter-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: var(--primary-fg);
    }

    .filter-count {
      font-size: 0.72rem;
      opacity: 0.8;
      background: rgba(125, 125, 125, 0.18);
      padding: 0.05rem 0.35rem;
      border-radius: var(--radius-full);
    }

    .day-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin: 1.75rem 0 0.85rem;
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
    }

    .day-header:first-of-type {
      margin-top: 0.5rem;
    }

    .day-line {
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .timeline {
      position: relative;
    }

    .timeline-item {
      position: relative;
      display: flex;
      gap: 1rem;
      margin-bottom: 0.95rem;
    }

    .timeline-time-col {
      width: 78px;
      flex-shrink: 0;
      text-align: right;
      padding-top: 0.35rem;
    }

    .block-time {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.98rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
      line-height: 1.1;
    }

    .block-period {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-left: 2px;
    }

    .block-ordinal-badge {
      display: inline-block;
      margin-top: 4px;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-muted);
      background: var(--surface-subtle);
      padding: 0.1rem 0.4rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      white-space: nowrap;
    }

    .timeline-spine {
      position: relative;
      width: 14px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .timeline-spine::before {
      content: "";
      position: absolute;
      top: 1.25rem;
      bottom: -1rem;
      width: 2px;
      background: var(--border);
    }

    .timeline-item:last-child .timeline-spine::before {
      display: none;
    }

    .timeline-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--surface);
      border: 2px solid var(--text-muted);
      margin-top: 0.65rem;
      z-index: 2;
    }

    .timeline-item.has-conflict .timeline-dot {
      border-color: var(--warning-text);
      background: var(--warning-bg);
    }

    .run-card {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.9rem 1.15rem;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .run-card:hover {
      box-shadow: var(--shadow-md);
      transform: translateY(-1px);
    }

    .run-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .game-name {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--text);
    }

    .field-pill {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.74rem;
      font-weight: 600;
      padding: 0.2rem 0.6rem;
      border-radius: var(--radius-full);
      letter-spacing: -0.02em;
      white-space: nowrap;
    }

    .field-pill.field-1 {
      background: var(--field1-bg);
      color: var(--field1-text);
      border: 1px solid var(--field1-border);
    }

    .field-pill.field-2 {
      background: var(--field2-bg);
      color: var(--field2-text);
      border: 1px solid var(--field2-border);
    }

    .field-pill.field-3 {
      background: var(--field3-bg);
      color: var(--field3-text);
      border: 1px solid var(--field3-border);
    }

    .field-pill.field-23 {
      background: var(--field23-bg);
      color: var(--field23-text);
      border: 1px solid var(--field23-border);
    }

    .run-card-middle {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.45rem;
      font-size: 0.82rem;
    }

    .dog-tag {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-weight: 600;
      color: var(--text);
      background: var(--surface-subtle);
      padding: 0.15rem 0.55rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
    }

    .meta-tag {
      font-size: 0.74rem;
      color: var(--text-muted);
      background: var(--surface-subtle);
      padding: 0.15rem 0.45rem;
      border-radius: var(--radius-sm);
      font-family: "JetBrains Mono", monospace;
    }

    .run-card-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      font-size: 0.76rem;
      color: var(--text-muted);
      padding-top: 0.35rem;
      border-top: 1px dashed var(--border);
    }

    .session-time {
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .conflict-tag {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 0.18rem 0.5rem;
      border-radius: var(--radius-full);
      background: var(--warning-bg);
      color: var(--warning-text);
      border: 1px solid var(--warning-border);
    }

    .break-indicator {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin: 0.5rem 0 0.85rem 92px;
      color: var(--text-faint);
      font-size: 0.75rem;
      font-weight: 500;
    }

    .break-line {
      flex: 1;
      height: 1px;
      border-bottom: 1px dashed var(--border);
    }

    .empty-state {
      text-align: center;
      padding: 3.5rem 1.5rem;
      color: var(--text-muted);
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
    }

    .empty-state-icon {
      font-size: 2.25rem;
      margin-bottom: 0.75rem;
      opacity: 0.7;
    }

    .empty-state-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.35rem;
    }

    .empty-state-subtitle {
      font-size: 0.875rem;
      color: var(--text-muted);
      max-width: 340px;
      margin: 0 auto 1.5rem;
    }

    .popular-chips {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.4rem;
      max-width: 480px;
      margin: 0 auto;
    }

    .popular-chip {
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.8rem;
      padding: 0.35rem 0.75rem;
      border-radius: var(--radius-full);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .popular-chip:hover {
      border-color: var(--text-muted);
    }

    .toast {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--primary);
      color: var(--primary-fg);
      padding: 0.6rem 1.1rem;
      border-radius: var(--radius-full);
      font-size: 0.82rem;
      font-weight: 500;
      box-shadow: var(--shadow-md);
      z-index: 100;
      opacity: 0;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    @media print {
      body {
        background: #fff;
        color: #000;
      }
      header, .search-section, .filter-section, .nav-actions, .break-indicator {
        display: none !important;
      }
      main {
        padding: 0;
        max-width: 100%;
      }
      .profile-card {
        border: none;
        box-shadow: none;
        padding: 0 0 1rem 0;
      }
      .timeline-spine {
        display: none;
      }
      .timeline-time-col {
        width: 70px;
        text-align: left;
      }
      .run-card {
        border: 1px solid #ccc;
        box-shadow: none;
        break-inside: avoid;
        margin-bottom: 0.5rem;
      }
    }

    @media (max-width: 520px) {
      .timeline-time-col {
        width: 68px;
      }
      .block-time {
        font-size: 0.9rem;
      }
      .break-indicator {
        margin-left: 82px;
      }
      .game-name {
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <a href="#" class="brand" onclick="clearHandlerSelection(); return false;">
        <div class="brand-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"></path>
            <path d="M2 12h20"></path>
          </svg>
        </div>
        <span>When Am I UpDog?</span>
      </a>

      <div class="nav-actions">
        <span class="badge" id="syncStatus" title="Live sync status across all event sheets">
          <span class="badge-dot syncing" id="syncDot"></span>
          <span id="syncText">Loading...</span>
        </span>

        <button class="btn-icon" id="refreshBtn" title="Sync live updates from Google Sheet" onclick="fetchAllEventData(true)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
            <path d="M3 3v5h5"></path>
            <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"></path>
            <path d="M16 21h5v-5"></path>
          </svg>
        </button>

        <button class="btn-icon" id="shareBtn" title="Copy personal link" onclick="copyShareLink()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path>
            <polyline points="16 6 12 2 8 6"></polyline>
            <line x1="12" y1="2" x2="12" y2="15"></line>
          </svg>
        </button>

        <button class="btn-icon" id="themeBtn" title="Toggle dark mode" onclick="toggleTheme()">
          <svg id="moonIcon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>

            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>

  <main>
    <div id="loadingState" class="loading-state">
      <div class="loading-spinner"></div>
      <p id="loadingMsg">Loading running orders & block times...</p>
    </div>

    <div id="appContent" style="display: none;">
      <div class="search-section">
        <div class="search-box">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input 
            type="text" 
            id="handlerSearch" 
            class="search-input" 
            placeholder="Search handler or dog name..." 
            autocomplete="off" 
            spellcheck="false"
          >
          <button class="search-clear" id="searchClearBtn" onclick="clearSearchInput()" title="Clear search">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
        <ul class="suggestions-list" id="suggestionsList"></ul>
      </div>

      <div id="profileContainer" style="display: none;"></div>
      <div id="scheduleContainer"></div>

      <div id="welcomeState" class="empty-state">
        <div class="empty-state-icon">🐾</div>
        <h3 class="empty-state-title">Select Your Name</h3>
        <p class="empty-state-subtitle">Search for your name or dog above to view your scheduled block times, block running orders, and fields.</p>
        <div class="popular-chips" id="popularChips"></div>
      </div>
    </div>
  </main>

  <div class="toast" id="toast">Link copied to clipboard</div>

  <script>
    const SHEET_ID = "11zydir3gG2eQOFpk_N9yVxEW6iRYmbRtJAdeS1R9feI";
    const GID_INDIVIDUAL_SCHEDULES = "1990171013";
    const REFRESH_INTERVAL_MS = 60000;

    const EVENT_TABS = [
      { id: "farout", name: "Far Out", mapKey: "far out", gid: "0", day: "Thursday", dayOrder: 0 },
      { id: "fireball", name: "Fireball", mapKey: "fireball", gid: "306313736", day: "Thursday", dayOrder: 0 },
      
      { id: "boom", name: "Boom!", mapKey: "boom", gid: "919833849", day: "Friday", dayOrder: 1 },
      { id: "timewarp", name: "TimeWarp", mapKey: "timewarp", gid: "698159220", day: "Friday", dayOrder: 1 },
      { id: "fs_fri", name: "Freestyle Performance", mapKey: "fs performance", gid: "1789212166", day: "Friday", dayOrder: 1 },
      { id: "sevenup", name: "7Up", mapKey: "7up", gid: "1717217507", day: "Friday", dayOrder: 1 },
      
      { id: "spacedout", name: "Spaced Out", mapKey: "spaced out", gid: "1732980814", day: "Saturday", dayOrder: 2 },
      { id: "fourway", name: "Four Way Play", mapKey: "four way play", gid: "159025477", day: "Saturday", dayOrder: 2 },
      { id: "fs_sat", name: "Freestyle Criterion", mapKey: "fs criterion", gid: "1374816905", day: "Saturday", dayOrder: 2 },
      { id: "funkey", name: "FunKey", mapKey: "funkey", gid: "1289351842", day: "Saturday", dayOrder: 2 },
      
      { id: "throwngo", name: "Throw N Go", mapKey: "throw n go", gid: "1968227423", day: "Sunday", dayOrder: 3 },
      { id: "frizgility", name: "Frizgility", mapKey: "frizgility", gid: "2097815225", day: "Sunday", dayOrder: 3 },
      { id: "greedy", name: "Greedy", mapKey: "greedy", gid: "291836125", day: "Sunday", dayOrder: 3 }
    ];

    const DAYS_ORDER = ["Thursday", "Friday", "Saturday", "Sunday"];

    let state = {
      handlersMap: new Map(),
      allHandlers: [],
      selectedHandler: null,
      selectedDog: null,
      selectedDay: "all",
      selectedField: "all",
      lastUpdated: null,
      isFetching: false
    };

    function parseTimeToMinutes(timeStr) {
      if (!timeStr) return 0;
      const [hStr, mStr] = timeStr.trim().split(":");
      let h = parseInt(hStr, 10);
      const m = parseInt(mStr, 10) || 0;
      
      if (h >= 7 && h <= 11) {
        // AM
      } else if (h === 12) {
        // PM
      } else if (h < 7) {
        h += 12; // PM
      }
      return h * 60 + m;
    }

    function formatMinutesToTime(totalMin) {
      const h24 = Math.floor(totalMin / 60);
      const m = totalMin % 60;
      const period = h24 >= 12 ? "PM" : "AM";
      let h12 = h24 % 12;
      if (h12 === 0) h12 = 12;
      const mPadded = m < 10 ? "0" + m : m;
      return {
        formatted: `${h12}:${mPadded}`,
        period: period,
        raw: `${h12}:${mPadded} ${period}`
      };
    }

    function formatBlockTimeWindow(timeStr) {
      const min = parseTimeToMinutes(timeStr);
      const start = formatMinutesToTime(min);
      const end = formatMinutesToTime(min + 30);
      return {
        start: start,
        end: end,
        range: `${start.formatted} ${start.period} &ndash; ${end.formatted} ${end.period}`
      };
    }

    function fetchGvizJsonp(gid, id) {
      return new Promise((resolve) => {
        const callbackName = "gvizCallback_" + id;
        
        window[callbackName] = function(resp) {
          delete window[callbackName];
          const s = document.getElementById("script_" + id);
          if (s) {
            if (s.parentNode) s.parentNode.removeChild(s);
            else if (typeof s.remove === "function") s.remove();
          }
          if (resp && resp.status === "ok" && resp.table) {
            resolve({ id: id, gid: gid, table: resp.table });
          } else {
            console.warn("GViz query failed for " + id, resp);
            resolve({ id: id, gid: gid, table: null });
          }
        };

        const oldScript = document.getElementById("script_" + id);
        if (oldScript) {
          if (oldScript.parentNode) oldScript.parentNode.removeChild(oldScript);
          else if (typeof oldScript.remove === "function") oldScript.remove();
        }

        const script = document.createElement("script");
        script.id = "script_" + id;
        script.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?gid=${gid}&tqx=responseHandler:${callbackName}&_t=${Date.now()}`;
        script.onerror = function() {
          delete window[callbackName];
          resolve({ id: id, gid: gid, table: null });
        };
        document.head.appendChild(script);
      });
    }

    function fetchAllEventData(manual = false) {
      if (state.isFetching) return;
      state.isFetching = true;

      const dot = document.getElementById("syncDot");
      const text = document.getElementById("syncText");
      const refreshBtn = document.getElementById("refreshBtn");
      const loadingMsg = document.getElementById("loadingMsg");

      if (dot) dot.className = "badge-dot syncing";
      if (text) text.textContent = "Syncing...";
      if (refreshBtn) refreshBtn.classList.add("spinning");

      if (manual) showToast("Syncing running orders & block times...");

      const allPromises = [
        fetchGvizJsonp(GID_INDIVIDUAL_SCHEDULES, "master_grid"),
        ...EVENT_TABS.map(tab => fetchGvizJsonp(tab.gid, tab.id))
      ];

      let completed = 0;
      allPromises.forEach(p => p.then(() => {
        completed++;
        if (loadingMsg) loadingMsg.textContent = `Loading event blocks (${completed}/${allPromises.length})...`;
      }));

      Promise.all(allPromises).then(results => {
        state.isFetching = false;
        if (refreshBtn) refreshBtn.classList.remove("spinning");

        const masterResult = results.find(r => r.id === "master_grid");
        const eventResults = results.filter(r => r.id !== "master_grid" && r.table !== null);

        if (!masterResult || !masterResult.table || eventResults.length === 0) {
          if (dot) dot.className = "badge-dot error";
          if (text) text.textContent = "Sync error";
          if (manual) showToast("Could not load sheets. Check network.");
          return;
        }

        processCombinedData(masterResult.table, eventResults);
        state.lastUpdated = new Date();
        updateSyncBadge();
        if (manual) showToast("Schedule updated with canonical block orders");
      }).catch(err => {
        console.error("Error fetching data:", err);
        state.isFetching = false;
        if (refreshBtn) refreshBtn.classList.remove("spinning");
        if (dot) dot.className = "badge-dot error";
        if (text) text.textContent = "Sync error";
      });
    }

    function processCombinedData(masterTable, eventResults) {
      const timeMap = new Map();
      const mRows = masterTable.rows || [];
      if (mRows.length > 0) {
        const mHeader = (mRows[0].c || []).map(c => getCellText(c));
        const gameColMap = new Map();
        for (let i = 2; i < mHeader.length; i++) {
          const colName = mHeader[i].toLowerCase().trim();
          if (colName) gameColMap.set(i, colName);
        }

        for (let r = 1; r < mRows.length; r++) {
          const cells = mRows[r].c || [];
          const handler = getCellText(cells[0]).toLowerCase();
          const dog = getCellText(cells[1]).toLowerCase();
          if (!handler) continue;

          gameColMap.forEach((gKey, colIdx) => {
            const val = getCellText(cells[colIdx]);
            if (val && val.includes("-")) {
              const parts = val.split("-");
              const timeStr = parts[1].trim();
              const key = `${handler}_${dog}_${gKey}`;
              timeMap.set(key, timeStr);
            }
          });
        }
      }

      const handlers = new Map();

      for (const evRes of eventResults) {
        const tab = EVENT_TABS.find(t => t.id === evRes.id);
        if (!tab) continue;

        const table = evRes.table;
        const cols = table.cols || [];
        const rows = table.rows || [];

        const handlerCols = [];
        for (let i = 0; i < cols.length; i++) {
          const lbl = (cols[i].label || "").toLowerCase();
          if (lbl.includes("handler")) {
            handlerCols.push(i);
          }
        }

        for (let gIdx = 0; gIdx < handlerCols.length; gIdx++) {
          const hIdx = handlerCols[gIdx];
          const nextHIdx = (gIdx + 1 < handlerCols.length) ? handlerCols[gIdx + 1] : cols.length;
          const hCol = cols[hIdx];
          const headerLabel = hCol.label || "";

          const fieldMatch = headerLabel.match(/Field\s+[\d\/]+/i);
          const fieldName = fieldMatch ? fieldMatch[0] : "Field 1";

          let dogIdx = hIdx + 1;
          let utnIdx = -1;
          let divIdx = -1;
          let jumpIdx = -1;

          for (let c = hIdx + 1; c < nextHIdx; c++) {
            const subLabel = (cols[c].label || "").toLowerCase();
            if (subLabel.includes("dog")) dogIdx = c;
            else if (subLabel.includes("utn")) utnIdx = c;
            else if (subLabel.includes("division")) divIdx = c;
            else if (subLabel.includes("jump")) jumpIdx = c;
          }

          const fieldRuns = [];
          for (let rIdx = 0; rIdx < rows.length; rIdx++) {
            const cells = rows[rIdx].c || [];
            const handler = getCellText(cells[hIdx]);
            const dog = getCellText(cells[dogIdx]);

            if (!handler || handler.toLowerCase() === "handler" || handler.toLowerCase() === "lunch") {
              continue;
            }

            const utn = utnIdx !== -1 ? getCellText(cells[utnIdx]) : "";
            const division = divIdx !== -1 ? getCellText(cells[divIdx]) : "";
            const jumpHeight = jumpIdx !== -1 ? getCellText(cells[jumpIdx]) : "";

            const key = `${handler.toLowerCase()}_${dog.toLowerCase()}_${tab.mapKey}`;
            const assignedTime = timeMap.get(key) || null;

            fieldRuns.push({
              handler: handler,
              dog: dog,
              utn: utn,
              division: division,
              jumpHeight: jumpHeight,
              time: assignedTime,
              orderInField: fieldRuns.length + 1
            });
          }

          let lastTime = "8:00";
          for (const fr of fieldRuns) {
            if (fr.time) {
              lastTime = fr.time;
            } else {
              fr.time = lastTime;
            }
          }

          const blocks = new Map();
          for (const fr of fieldRuns) {
            if (!blocks.has(fr.time)) blocks.set(fr.time, []);
            blocks.get(fr.time).push(fr);
          }

          blocks.forEach((bRuns, bTime) => {
            const totalInBlock = bRuns.length;
            bRuns.forEach((fr, idx) => {
              const ordinalInBlock = idx + 1;
              const timeMinutes = parseTimeToMinutes(bTime);
              const sortKey = (tab.dayOrder * 1000000) + (timeMinutes * 1000) + ordinalInBlock;

              if (!handlers.has(fr.handler)) {
                handlers.set(fr.handler, {
                  name: fr.handler,
                  dogs: new Set(),
                  runs: []
                });
              }

              const hData = handlers.get(fr.handler);
              if (fr.dog) hData.dogs.add(fr.dog);

              hData.runs.push({
                game: tab.name,
                day: tab.day,
                dayOrder: tab.dayOrder,
                field: fieldName,
                blockTime: bTime,
                blockMinutes: timeMinutes,
                ordinalInBlock: ordinalInBlock,
                totalInBlock: totalInBlock,
                dog: fr.dog,
                utn: fr.utn,
                division: fr.division,
                jumpHeight: fr.jumpHeight,
                sortKey: sortKey
              });
            });
          });
        }
      }

      for (const hData of handlers.values()) {
        hData.runs.sort((a, b) => a.sortKey - b.sortKey);
      }

      state.handlersMap = handlers;
      state.allHandlers = Array.from(handlers.values()).sort((a, b) => a.name.localeCompare(b.name));

      document.getElementById("loadingState").style.display = "none";
      document.getElementById("appContent").style.display = "block";

      renderPopularChips();

      const hashParam = getHashParam("handler");
      const savedHandler = hashParam || localStorage.getItem("updog_selected_handler");
      if (savedHandler && state.handlersMap.has(savedHandler)) {
        selectHandler(savedHandler);
      } else if (state.selectedHandler && state.handlersMap.has(state.selectedHandler)) {
        renderSchedule();
      }
    }

    function getCellText(cell) {
      if (!cell) return "";
      if (cell.f !== undefined && cell.f !== null) return String(cell.f).trim();
      if (cell.v !== undefined && cell.v !== null) return String(cell.v).trim();
      return "";
    }

    function updateSyncBadge() {
      const dot = document.getElementById("syncDot");
      const text = document.getElementById("syncText");
      if (!dot || !text) return;
      dot.className = "badge-dot";
      
      if (state.lastUpdated) {
        const timeStr = state.lastUpdated.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
        text.textContent = `Synced ${timeStr}`;
      } else {
        text.textContent = "Live";
      }
    }

    setInterval(() => {
      fetchAllEventData(false);
    }, REFRESH_INTERVAL_MS);

    window.addEventListener("focus", () => {
      if (!state.lastUpdated || (Date.now() - state.lastUpdated.getTime() > 20000)) {
        fetchAllEventData(false);
      }
    });

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        fetchAllEventData(false);
      }
    });

    function getHashParam(key) {
      try {
        const hash = window.location.hash.substring(1);
        const params = new URLSearchParams(hash);
        return params.get(key);
      } catch (e) {
        return null;
      }
    }

    function setHashParam(key, val) {
      const hash = window.location.hash.substring(1);
      const params = new URLSearchParams(hash);
      if (val) {
        params.set(key, val);
      } else {
        params.delete(key);
      }
      window.history.replaceState(null, "", "#" + params.toString());
    }

    function selectHandler(name) {
      if (!state.handlersMap.has(name)) return;
      state.selectedHandler = name;
      state.selectedDog = null;
      state.selectedDay = "all";
      state.selectedField = "all";
      localStorage.setItem("updog_selected_handler", name);
      setHashParam("handler", name);

      const input = document.getElementById("handlerSearch");
      if (input) input.value = name;
      const clearBtn = document.getElementById("searchClearBtn");
      if (clearBtn) clearBtn.style.display = "block";
      closeSuggestions();

      renderSchedule();
    }

    function clearHandlerSelection() {
      state.selectedHandler = null;
      state.selectedDog = null;
      state.selectedDay = "all";
      state.selectedField = "all";
      localStorage.removeItem("updog_selected_handler");
      setHashParam("handler", null);

      const input = document.getElementById("handlerSearch");
      if (input) input.value = "";
      const clearBtn = document.getElementById("searchClearBtn");
      if (clearBtn) clearBtn.style.display = "none";
      closeSuggestions();

      renderSchedule();
    }

    function selectDog(dogName) {
      state.selectedDog = dogName;
      renderSchedule();
    }

    function selectDay(dayName) {
      state.selectedDay = dayName;
      renderSchedule();
    }

    function selectField(fieldName) {
      state.selectedField = fieldName;
      renderSchedule();
    }

    function renderPopularChips() {
      const container = document.getElementById("popularChips");
      if (!container) return;
      const sortedByRuns = [...state.allHandlers]
        .sort((a, b) => b.runs.length - a.runs.length)
        .slice(0, 8);

      container.innerHTML = sortedByRuns.map(h => `
        <button class="popular-chip" onclick="selectHandler('${escapeHtml(h.name)}')">
          ${escapeHtml(h.name)} (${h.runs.length})
        </button>
      `).join("");
    }

    function renderSchedule() {
      const welcome = document.getElementById("welcomeState");
      const profile = document.getElementById("profileContainer");
      const schedule = document.getElementById("scheduleContainer");

      if (!state.selectedHandler || !state.handlersMap.has(state.selectedHandler)) {
        welcome.style.display = "block";
        profile.style.display = "none";
        schedule.innerHTML = "";
        return;
      }

      welcome.style.display = "none";
      profile.style.display = "block";

      const handlerData = state.handlersMap.get(state.selectedHandler);
      const allRuns = handlerData.runs;
      const dogs = Array.from(handlerData.dogs).sort();

      const activeDays = DAYS_ORDER.filter(d => allRuns.some(r => r.day === d));
      const activeFields = Array.from(new Set(allRuns.map(r => r.field))).sort();

      let filteredRuns = allRuns;
      if (state.selectedDog) {
        filteredRuns = filteredRuns.filter(r => r.dog === state.selectedDog);
      }
      if (state.selectedDay !== "all") {
        filteredRuns = filteredRuns.filter(r => r.day === state.selectedDay);
      }
      if (state.selectedField !== "all") {
        filteredRuns = filteredRuns.filter(r => r.field === state.selectedField);
      }

      profile.innerHTML = `
        <div class="profile-card">
          <div class="profile-header">
            <div>
              <h2 class="profile-title">${escapeHtml(handlerData.name)}</h2>
              <div class="profile-stats">
                <span class="stat-chip">${allRuns.length} Total Runs</span>
                <span class="stat-chip">${dogs.length} ${dogs.length === 1 ? "Dog" : "Dogs"}</span>
                <span class="stat-chip">${activeDays.length} Competition ${activeDays.length === 1 ? "Day" : "Days"}</span>
              </div>
            </div>
          </div>

          <div class="filter-section">
            <div class="filter-row">
              <span class="filter-label">Day:</span>
              <button 
                class="filter-btn ${state.selectedDay === "all" ? "active" : ""}" 
                onclick="selectDay('all')"
              >
                <span>All Days</span>
                <span class="filter-count">${state.selectedDog ? allRuns.filter(r => r.dog === state.selectedDog).length : allRuns.length}</span>
              </button>
              ${activeDays.map(d => {
                const dayRuns = allRuns.filter(r => r.day === d && (!state.selectedDog || r.dog === state.selectedDog));
                return `
                  <button 
                    class="filter-btn ${state.selectedDay === d ? "active" : ""}" 
                    onclick="selectDay('${d}')"
                  >
                    <span>${d}</span>
                    <span class="filter-count">${dayRuns.length}</span>
                  </button>
                `;
              }).join("")}
            </div>

            ${dogs.length > 1 ? `
              <div class="filter-row">
                <span class="filter-label">Dog:</span>
                <button 
                  class="filter-btn ${state.selectedDog === null ? "active" : ""}" 
                  onclick="selectDog(null)"
                >
                  <span>All Dogs</span>
                </button>
                ${dogs.map(dog => {
                  const dogCount = allRuns.filter(r => r.dog === dog && (state.selectedDay === "all" || r.day === state.selectedDay)).length;
                  return `
                    <button 
                      class="filter-btn ${state.selectedDog === dog ? "active" : ""}" 
                      onclick="selectDog('${escapeHtml(dog)}')"
                    >
                      <span>🐾 ${escapeHtml(dog)}</span>
                      <span class="filter-count">${dogCount}</span>
                    </button>
                  `;
                }).join("")}
              </div>
            ` : ""}

            ${activeFields.length > 1 ? `
              <div class="filter-row">
                <span class="filter-label">Field:</span>
                <button 
                  class="filter-btn ${state.selectedField === "all" ? "active" : ""}" 
                  onclick="selectField('all')"
                >
                  <span>All Fields</span>
                </button>
                ${activeFields.map(f => `
                  <button 
                    class="filter-btn ${state.selectedField === f ? "active" : ""}" 
                    onclick="selectField('${escapeHtml(f)}')"
                  >
                    <span>${escapeHtml(f)}</span>
                  </button>
                `).join("")}
              </div>
            ` : ""}
          </div>
        </div>
      `;

      if (filteredRuns.length === 0) {
        schedule.innerHTML = `
          <div class="empty-state">
            <p>No runs match the current filter selection.</p>
          </div>
        `;
        return;
      }

      let currentDay = null;
      let timelineHtml = "";

      for (let i = 0; i < filteredRuns.length; i++) {
        const run = filteredRuns[i];
        const prevRun = i > 0 ? filteredRuns[i - 1] : null;

        if (run.day !== currentDay) {
          if (currentDay !== null) {
            timelineHtml += `</div>`;
          }
          currentDay = run.day;
          timelineHtml += `
            <div class="day-header">
              <span>${run.day}</span>
              <span class="day-line"></span>
            </div>
            <div class="timeline">
          `;
        }

        if (prevRun && prevRun.day === run.day) {
          const gapMin = run.blockMinutes - prevRun.blockMinutes;
          if (gapMin >= 45) {
            const hrs = Math.floor(gapMin / 60);
            const mins = gapMin % 60;
            const gapStr = hrs > 0 ? `${hrs}h ${mins > 0 ? mins + "m" : ""}` : `${mins}m`;
            timelineHtml += `
              <div class="break-indicator">
                <span class="break-line"></span>
                <span>${gapStr} break</span>
                <span class="break-line"></span>
              </div>
            `;
          }
        }

        const blockTime = formatBlockTimeWindow(run.blockTime);
        const fieldClass = getFieldClass(run.field);

        let tightTurnaroundNotice = null;
        for (const other of allRuns) {
          if (other !== run && other.day === run.day && other.blockTime === run.blockTime) {
            if (other.field === run.field) {
              const diff = Math.abs(run.ordinalInBlock - other.ordinalInBlock);
              tightTurnaroundNotice = `Same block as ${other.dog} (${diff} spot${diff === 1 ? "" : "s"} apart)`;
            } else {
              tightTurnaroundNotice = `Concurrent: ${other.dog} on ${other.field}`;
            }
            break;
          }
        }

        timelineHtml += `
          <div class="timeline-item ${tightTurnaroundNotice ? "has-conflict" : ""}">
            <div class="timeline-time-col">
              <div>
                <span class="block-time">${blockTime.start.formatted}</span>
                <span class="block-period">${blockTime.start.period}</span>
              </div>
              <div class="block-ordinal-badge">
                #${run.ordinalInBlock} of ${run.totalInBlock}
              </div>
            </div>
            <div class="timeline-spine">
              <span class="timeline-dot"></span>
            </div>
            <div class="run-card">
              <div class="run-card-top">
                <h4 class="game-name">${escapeHtml(run.game)}</h4>
                <span class="field-pill ${fieldClass}">${escapeHtml(run.field)}</span>
              </div>
              <div class="run-card-middle">
                <span class="dog-tag">
                  <span>🐾</span>
                  <span>${escapeHtml(run.dog || "Unassigned")}</span>
                </span>
                ${run.division ? `<span class="meta-tag">${escapeHtml(run.division)}</span>` : ""}
                ${run.jumpHeight ? `<span class="meta-tag">${escapeHtml(run.jumpHeight)}"</span>` : ""}
                ${run.utn ? `<span class="meta-tag">${escapeHtml(run.utn)}</span>` : ""}
              </div>
              <div class="run-card-bottom">
                <span class="session-time">
                  🕒 ${blockTime.range} Block
                </span>
                ${tightTurnaroundNotice ? `
                  <span class="conflict-tag">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                      <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"></path>
                      <line x1="12" y1="9" x2="12" y2="13"></line>
                      <line x1="12" y1="17" x2="12.01" y2="17"></line>
                    </svg>
                    ${escapeHtml(tightTurnaroundNotice)}
                  </span>
                ` : ""}
              </div>
            </div>
          </div>
        `;
      }

      if (currentDay !== null) {
        timelineHtml += `</div>`;
      }

      schedule.innerHTML = timelineHtml;
    }

    function getFieldClass(field) {
      if (!field) return "field-1";
      const cleaned = field.toLowerCase();
      if (cleaned.includes("2/3")) return "field-23";
      if (cleaned.includes("3")) return "field-3";
      if (cleaned.includes("2")) return "field-2";
      return "field-1";
    }

    const searchInput = document.getElementById("handlerSearch");
    const suggestionsList = document.getElementById("suggestionsList");
    const clearBtn = document.getElementById("searchClearBtn");

    searchInput.addEventListener("input", (e) => {
      const q = e.target.value.trim().toLowerCase();
      clearBtn.style.display = q ? "block" : "none";

      if (!q) {
        closeSuggestions();
        return;
      }

      const matches = [];
      for (const h of state.allHandlers) {
        const handlerMatch = h.name.toLowerCase().includes(q);
        const matchingDogs = Array.from(h.dogs).filter(d => d.toLowerCase().includes(q));

        if (handlerMatch || matchingDogs.length > 0) {
          matches.push({
            name: h.name,
            runsCount: h.runs.length,
            dogs: Array.from(h.dogs),
            matchedDog: !handlerMatch && matchingDogs.length > 0 ? matchingDogs[0] : null
          });
        }
      }

      renderSuggestions(matches);
    });

    searchInput.addEventListener("focus", (e) => {
      if (e.target.value.trim()) {
        e.target.dispatchEvent(new Event("input"));
      } else {
        const top = state.allHandlers.slice(0, 10);
        renderSuggestions(top.map(h => ({
          name: h.name,
          runsCount: h.runs.length,
          dogs: Array.from(h.dogs)
        })));
      }
    });

    function renderSuggestions(items) {
      if (!items || items.length === 0) {
        suggestionsList.innerHTML = `<li class="suggestion-item"><span class="suggestion-meta">No matching handlers or dogs</span></li>`;
        suggestionsList.style.display = "block";
        return;
      }

      suggestionsList.innerHTML = items.slice(0, 15).map(item => `
        <li class="suggestion-item" onclick="selectHandler('${escapeHtml(item.name)}')">
          <div>
            <div class="suggestion-name">${escapeHtml(item.name)}</div>
            <div class="suggestion-meta">
              ${item.matchedDog ? `Matches dog: 🐾 <strong>${escapeHtml(item.matchedDog)}</strong> &bull; ` : ""}
              ${escapeHtml(item.dogs.join(", "))}
            </div>
          </div>
          <span class="suggestion-meta">${item.runsCount} runs</span>
        </li>
      `).join("");
      suggestionsList.style.display = "block";
    }

    function closeSuggestions() {
      suggestionsList.style.display = "none";
    }

    function clearSearchInput() {
      clearHandlerSelection();
    }

    document.addEventListener("click", (e) => {
      if (!e.target.closest(".search-section")) {
        closeSuggestions();
      }
    });

    function copyShareLink() {
      const url = window.location.href;
      navigator.clipboard.writeText(url).then(() => {
        showToast(state.selectedHandler ? `Link copied for ${state.selectedHandler}` : "Link copied to clipboard");
      }).catch(() => {
        showToast("Unable to copy link");
      });
    }

    function showToast(msg) {
      const toast = document.getElementById("toast");
      toast.innerHTML = msg;
      toast.classList.add("show");
      setTimeout(() => {
        toast.classList.remove("show");
      }, 2600);
    }

    function toggleTheme() {
      const cur = document.documentElement.getAttribute("data-theme");
      const next = cur === "dark" ? "light" : "dark";
      setTheme(next);
    }

    function setTheme(theme) {
      document.documentElement.setAttribute("data-theme", theme);
      localStorage.setItem("updog_theme", theme);
      document.getElementById("moonIcon").style.display = theme === "dark" ? "none" : "block";
      document.getElementById("sunIcon").style.display = theme === "dark" ? "block" : "none";
    }

    const savedTheme = localStorage.getItem("updog_theme") || 
      (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    setTheme(savedTheme);

    function escapeHtml(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    fetchAllEventData(false);
  </script>
</body>
</html>
