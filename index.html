<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Northeast Classic &mdash; UpDog Schedule</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-subtle: #f1f5f9;
      --border: #e2e8f0;
      --border-subtle: #f1f5f9;
      --text: #0f172a;
      --text-muted: #64748b;
      --text-faint: #94a3b8;
      --primary: #0f172a;
      --primary-fg: #f8fafc;
      --accent: #2563eb;
      --ring1-bg: #eff6ff;
      --ring1-text: #1d4ed8;
      --ring1-border: #bfdbfe;
      --ring2-bg: #f5f3ff;
      --ring2-text: #6d28d9;
      --ring2-border: #ddd6fe;
      --ring3-bg: #ecfdf5;
      --ring3-text: #047857;
      --ring3-border: #a7f3d0;
      --ring23-bg: #fff7ed;
      --ring23-text: #c2410c;
      --ring23-border: #fed7aa;
      --warning-bg: #fef2f2;
      --warning-text: #b91c1c;
      --warning-border: #fecaca;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      --radius: 12px;
      --radius-sm: 8px;
      --radius-full: 9999px;
    }

    [data-theme="dark"] {
      --bg: #09090b;
      --surface: #121215;
      --surface-subtle: #18181b;
      --border: #27272a;
      --border-subtle: #1e1e24;
      --text: #f4f4f5;
      --text-muted: #a1a1aa;
      --text-faint: #71717a;
      --primary: #f4f4f5;
      --primary-fg: #09090b;
      --accent: #3b82f6;
      --ring1-bg: rgba(30, 58, 138, 0.25);
      --ring1-text: #93c5fd;
      --ring1-border: rgba(59, 130, 246, 0.3);
      --ring2-bg: rgba(76, 29, 149, 0.25);
      --ring2-text: #c4b5fd;
      --ring2-border: rgba(139, 92, 246, 0.3);
      --ring3-bg: rgba(6, 78, 59, 0.25);
      --ring3-text: #6ee7b7;
      --ring3-border: rgba(16, 185, 129, 0.3);
      --ring23-bg: rgba(124, 45, 18, 0.25);
      --ring23-text: #fdba74;
      --ring23-border: rgba(249, 115, 22, 0.3);
      --warning-bg: rgba(127, 29, 29, 0.3);
      --warning-text: #fca5a5;
      --warning-border: rgba(239, 68, 68, 0.35);
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.5);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0.85rem 1.25rem;
    }

    .header-inner {
      max-width: 680px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      text-decoration: none;
      color: var(--text);
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: -0.02em;
    }

    .brand-icon {
      width: 28px;
      height: 28px;
      border-radius: var(--radius-sm);
      background: var(--primary);
      color: var(--primary-fg);
      display: grid;
      place-items: center;
      font-size: 0.85rem;
      flex-shrink: 0;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.72rem;
      font-weight: 500;
      padding: 0.2rem 0.6rem;
      border-radius: var(--radius-full);
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      color: var(--text-muted);
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10b981;
      display: inline-block;
    }

    .badge-dot.syncing {
      background: #f59e0b;
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .btn-icon {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      cursor: pointer;
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      display: grid;
      place-items: center;
      transition: all 0.15s ease;
    }

    .btn-icon:hover {
      background: var(--surface-subtle);
      color: var(--text);
      border-color: var(--text-muted);
    }

    main {
      flex: 1;
      max-width: 680px;
      width: 100%;
      margin: 0 auto;
      padding: 1.5rem 1.25rem 4rem;
    }

    /* Search & Selector Card */
    .search-section {
      margin-bottom: 1.5rem;
      position: relative;
    }

    .search-box {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-icon {
      position: absolute;
      left: 1rem;
      color: var(--text-faint);
      pointer-events: none;
      width: 18px;
      height: 18px;
    }

    .search-input {
      width: 100%;
      padding: 0.85rem 2.75rem 0.85rem 2.65rem;
      font-size: 0.95rem;
      font-family: inherit;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      outline: none;
      transition: all 0.2s ease;
    }

    .search-input:focus {
      border-color: var(--text);
      box-shadow: 0 0 0 1px var(--text), var(--shadow-sm);
    }

    .search-clear {
      position: absolute;
      right: 0.75rem;
      background: none;
      border: none;
      color: var(--text-faint);
      cursor: pointer;
      padding: 0.25rem;
      display: none;
    }

    .search-clear:hover {
      color: var(--text);
    }

    /* Autocomplete Dropdown */
    .suggestions-list {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      z-index: 40;
      max-height: 280px;
      overflow-y: auto;
      list-style: none;
      display: none;
    }

    .suggestion-item {
      padding: 0.7rem 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-subtle);
      font-size: 0.9rem;
      transition: background-color 0.1s ease;
    }

    .suggestion-item:last-child {
      border-bottom: none;
    }

    .suggestion-item:hover {
      background: var(--surface-subtle);
    }

    .suggestion-name {
      font-weight: 500;
      color: var(--text);
    }

    .suggestion-meta {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    /* Handler Profile Card */
    .profile-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      margin-bottom: 1.5rem;
      box-shadow: var(--shadow-sm);
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .profile-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 0.85rem;
    }

    .profile-title {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    .profile-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.35rem;
    }

    .stat-chip {
      font-size: 0.78rem;
      color: var(--text-muted);
      background: var(--surface-subtle);
      padding: 0.2rem 0.55rem;
      border-radius: var(--radius-sm);
      font-weight: 500;
    }

    /* Filter sections (Days and Dogs) */
    .filter-section {
      padding-top: 0.85rem;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }

    .filter-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    .filter-label {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-faint);
      margin-right: 0.25rem;
      min-width: 42px;
    }

    .filter-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 500;
      padding: 0.3rem 0.7rem;
      border-radius: var(--radius-full);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.15s ease;
    }

    .filter-btn:hover {
      background: var(--surface-subtle);
      color: var(--text);
    }

    .filter-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: var(--primary-fg);
    }

    .filter-count {
      font-size: 0.72rem;
      opacity: 0.8;
      background: rgba(125, 125, 125, 0.18);
      padding: 0.05rem 0.35rem;
      border-radius: var(--radius-full);
    }

    /* Day Group Header */
    .day-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin: 1.75rem 0 0.85rem;
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
    }

    .day-header:first-of-type {
      margin-top: 0.5rem;
    }

    .day-line {
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* Timeline Structure */
    .timeline {
      position: relative;
    }

    .timeline-item {
      position: relative;
      display: flex;
      gap: 1rem;
      margin-bottom: 0.85rem;
    }

    /* Time Column */
    .timeline-time {
      width: 76px;
      flex-shrink: 0;
      text-align: right;
      padding-top: 0.45rem;
    }

    .time-val {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.92rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    .time-period {
      font-size: 0.7rem;
      font-weight: 500;
      color: var(--text-faint);
      margin-left: 2px;
      text-transform: uppercase;
    }

    /* Timeline Track and Spine */
    .timeline-spine {
      position: relative;
      width: 14px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .timeline-spine::before {
      content: "";
      position: absolute;
      top: 1.25rem;
      bottom: -1rem;
      width: 2px;
      background: var(--border);
    }

    .timeline-item:last-child .timeline-spine::before {
      display: none;
    }

    .timeline-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--surface);
      border: 2px solid var(--text-muted);
      margin-top: 0.65rem;
      z-index: 2;
    }

    .timeline-item.has-conflict .timeline-dot {
      border-color: var(--warning-text);
      background: var(--warning-bg);
    }

    /* Run Card */
    .run-card {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.85rem 1.1rem;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .run-card:hover {
      box-shadow: var(--shadow-md);
      transform: translateY(-1px);
    }

    .run-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .game-name {
      font-size: 0.98rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text);
    }

    /* Ring Badges */
    .ring-pill {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.74rem;
      font-weight: 600;
      padding: 0.2rem 0.55rem;
      border-radius: var(--radius-full);
      letter-spacing: -0.02em;
      white-space: nowrap;
    }

    .ring-pill.ring-1 {
      background: var(--ring1-bg);
      color: var(--ring1-text);
      border: 1px solid var(--ring1-border);
    }

    .ring-pill.ring-2 {
      background: var(--ring2-bg);
      color: var(--ring2-text);
      border: 1px solid var(--ring2-border);
    }

    .ring-pill.ring-3 {
      background: var(--ring3-bg);
      color: var(--ring3-text);
      border: 1px solid var(--ring3-border);
    }

    .ring-pill.ring-23 {
      background: var(--ring23-bg);
      color: var(--ring23-text);
      border: 1px solid var(--ring23-border);
    }

    .run-card-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      font-size: 0.82rem;
    }

    .dog-tag {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* Conflict / Overlap Banner */
    .conflict-tag {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 0.18rem 0.5rem;
      border-radius: var(--radius-full);
      background: var(--warning-bg);
      color: var(--warning-text);
      border: 1px solid var(--warning-border);
    }

    /* Break Divider */
    .break-indicator {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin: 0.5rem 0 0.85rem 90px;
      color: var(--text-faint);
      font-size: 0.75rem;
      font-weight: 500;
    }

    .break-line {
      flex: 1;
      height: 1px;
      border-bottom: 1px dashed var(--border);
    }

    /* Empty & Initial State */
    .empty-state {
      text-align: center;
      padding: 3.5rem 1.5rem;
      color: var(--text-muted);
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
    }

    .empty-state-icon {
      font-size: 2.25rem;
      margin-bottom: 0.75rem;
      opacity: 0.7;
    }

    .empty-state-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.35rem;
    }

    .empty-state-subtitle {
      font-size: 0.875rem;
      color: var(--text-muted);
      max-width: 320px;
      margin: 0 auto 1.5rem;
    }

    .popular-chips {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.4rem;
      max-width: 460px;
      margin: 0 auto;
    }

    .popular-chip {
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.8rem;
      padding: 0.35rem 0.75rem;
      border-radius: var(--radius-full);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .popular-chip:hover {
      border-color: var(--text-muted);
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--primary);
      color: var(--primary-fg);
      padding: 0.6rem 1.1rem;
      border-radius: var(--radius-full);
      font-size: 0.82rem;
      font-weight: 500;
      box-shadow: var(--shadow-md);
      z-index: 100;
      opacity: 0;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* Print Styles */
    @media print {
      body {
        background: #fff;
        color: #000;
      }
      header, .search-section, .filter-section, .nav-actions, .break-indicator {
        display: none !important;
      }
      main {
        padding: 0;
        max-width: 100%;
      }
      .profile-card {
        border: none;
        box-shadow: none;
        padding: 0 0 1rem 0;
      }
      .timeline-spine {
        display: none;
      }
      .timeline-time {
        width: 70px;
        text-align: left;
      }
      .run-card {
        border: 1px solid #ccc;
        box-shadow: none;
        break-inside: avoid;
        margin-bottom: 0.5rem;
      }
    }

    @media (max-width: 520px) {
      .timeline-time {
        width: 65px;
      }
      .time-val {
        font-size: 0.85rem;
      }
      .break-indicator {
        margin-left: 79px;
      }
      .game-name {
        font-size: 0.92rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <a href="#" class="brand" onclick="clearHandlerSelection(); return false;">
        <div class="brand-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"></path>
            <path d="M2 12h20"></path>
          </svg>
        </div>
        <span>Northeast Classic</span>
      </a>

      <div class="nav-actions">
        <span class="badge" id="syncStatus" title="Direct live sync with Google Sheet">
          <span class="badge-dot" id="syncDot"></span>
          <span id="syncText">Live</span>
        </span>

        <button class="btn-icon" id="refreshBtn" title="Sync live updates" onclick="fetchLiveSchedule(true)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
            <path d="M3 3v5h5"></path>
            <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"></path>
            <path d="M16 21h5v-5"></path>
          </svg>
        </button>

        <button class="btn-icon" id="shareBtn" title="Copy personal link" onclick="copyShareLink()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path>
            <polyline points="16 6 12 2 8 6"></polyline>
            <line x1="12" y1="2" x2="12" y2="15"></line>
          </svg>
        </button>

        <button class="btn-icon" id="themeBtn" title="Toggle dark mode" onclick="toggleTheme()">
          <svg id="moonIcon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
          <svg id="sunIcon" style="display:none;" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main>
    <!-- Search / Handler Selector -->
    <div class="search-section">
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input 
          type="text" 
          id="handlerSearch" 
          class="search-input" 
          placeholder="Search handler or dog name..." 
          autocomplete="off" 
          spellcheck="false"

    // Days mapping corresponding to the four game sections separated by blank columns
    const DAY_CONFIG = [
      { name: "Thursday", short: "Thu", order: 0 },
      { name: "Friday", short: "Fri", order: 1 },
      { name: "Saturday", short: "Sat", order: 2 },
      { name: "Sunday", short: "Sun", order: 3 }
    ];

    // App state
    let state = {
      handlersMap: new Map(),
      allHandlers: [],
      selectedHandler: null,
      selectedDog: null,
      selectedDay: "all",
      isLive: false
    };

    function parseTimeToMinutes(timeStr) {
      if (!timeStr) return 0;
      const [hStr, mStr] = timeStr.trim().split(":");
      let h = parseInt(hStr, 10);
      const m = parseInt(mStr, 10) || 0;
      
      // Competitions run 8:00 AM - 6:00 PM
      if (h >= 7 && h <= 11) {
        // AM
      } else if (h === 12) {
        // PM
      } else if (h < 7) {
        h += 12; // PM
      }
      return h * 60 + m;
    }

    function formatMinutesToTime(totalMin) {
      const h24 = Math.floor(totalMin / 60);
      const m = totalMin % 60;
      const period = h24 >= 12 ? "PM" : "AM";
      let h12 = h24 % 12;
      if (h12 === 0) h12 = 12;
      const mPadded = m < 10 ? "0" + m : m;
      return {
        formatted: `${h12}:${mPadded}`,
        period: period,
        raw: `${h12}:${mPadded} ${period}`
      };
    }

    function parseCSVLine(line) {
      const result = [];
      let cur = "";
      let inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const c = line[i];
        if (c === '"') {
          if (inQuotes && line[i + 1] === '"') {
            cur += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (c === "," && !inQuotes) {
          result.push(cur);
          cur = "";
        } else {
          cur += c;
        }
      }
      result.push(cur);
      return result;
    }

    function parseCSV(text) {
      const lines = text.split(/\r?\n/);
      if (lines.length === 0) return new Map();

      const headerRow = parseCSVLine(lines[0]);
      
      // Determine day mapping based on column groups separated by blank headers
      // Columns: Handler, Dog, Far Out, Fireball, [blank], Boom, FS Performance, TimeWarp, 7Up, [blank], Spaced Out, FS Criterion, Four Way Play, FunKey, [blank], Throw N Go, Frizgility, Greedy
      const games = [];
      let currentDayIndex = 0;

      for (let i = 2; i < headerRow.length; i++) {
        const title = headerRow[i].trim();
        if (!title) {
          currentDayIndex++;
          continue;
        }
        const dayInfo = DAY_CONFIG[currentDayIndex] || { name: "Day " + (currentDayIndex + 1), short: "D" + (currentDayIndex + 1), order: currentDayIndex };
        games.push({
          index: i,
          title: title,
          day: dayInfo.name,
          dayShort: dayInfo.short,
          dayOrder: dayInfo.order
        });
      }

      const handlers = new Map();

      for (let i = 1; i < lines.length; i++) {
        const line = lines[i].trim();
        if (!line) continue;
        const cols = parseCSVLine(line);
        if (cols.length < 2) continue;

        const handler = cols[0].trim();
        const dog = cols[1].trim();
        if (!handler) continue;

        if (!handlers.has(handler)) {
          handlers.set(handler, {
            name: handler,
            dogs: new Set(),
            runs: []
          });
        }

        const handlerData = handlers.get(handler);
        if (dog) handlerData.dogs.add(dog);

        for (const game of games) {
          if (cols.length > game.index) {
            const rawVal = cols[game.index].trim();
            if (rawVal) {
              const parts = rawVal.split("-");
              const ring = parts[0].trim();
              const time = parts[1] ? parts[1].trim() : "";
              const minutes = parseTimeToMinutes(time);
              const sortKey = (game.dayOrder * 1440) + minutes;

              handlerData.runs.push({
                handler: handler,
                dog: dog,
                game: game.title,
                day: game.day,
                dayShort: game.dayShort,
                dayOrder: game.dayOrder,
                ring: ring,
                time: time,
                minutes: minutes,
                sortKey: sortKey
              });
            }
          }
        }
      }

      for (const hData of handlers.values()) {
        hData.runs.sort((a, b) => a.sortKey - b.sortKey);
      }

      return handlers;
    }

    function ingestScheduleData(csvText, isLiveSource) {
      try {
        const parsed = parseCSV(csvText);
        if (parsed.size > 0) {
          state.handlersMap = parsed;
          state.allHandlers = Array.from(parsed.values()).sort((a, b) => a.name.localeCompare(b.name));
          state.isLive = isLiveSource;

          const dot = document.getElementById("syncDot");
          const text = document.getElementById("syncText");
          dot.classList.remove("syncing");
          if (isLiveSource) {
            text.textContent = "Live";
            dot.style.background = "#10b981";
          } else {
            text.textContent = "Cached";
            dot.style.background = "#64748b";
          }

          renderPopularChips();

          const hashParam = getHashParam("handler");
          const savedHandler = hashParam || localStorage.getItem("updog_selected_handler");
          if (savedHandler && state.handlersMap.has(savedHandler)) {
            selectHandler(savedHandler);
          } else if (state.selectedHandler && state.handlersMap.has(state.selectedHandler)) {
            renderSchedule();
          }
        }
      } catch (err) {
        console.error("Error parsing schedule CSV:", err);
      }
    }

    async function fetchLiveSchedule(manual = false) {
      const dot = document.getElementById("syncDot");
      const text = document.getElementById("syncText");
      dot.classList.add("syncing");
      text.textContent = "Syncing...";

      if (manual) showToast("Checking for live updates...");

      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 7000);
        const resp = await fetch(SHEET_CSV_URL, {
          cache: "no-cache",
          signal: controller.signal
        });
        clearTimeout(timeoutId);

        if (!resp.ok) throw new Error("HTTP error " + resp.status);
        const csv = await resp.text();
        ingestScheduleData(csv, true);
        if (manual) showToast("Schedule updated from Google Sheet");
      } catch (e) {
        console.warn("Live fetch failed or offline; using offline cache:", e);
        dot.classList.remove("syncing");
        text.textContent = "Offline";
        dot.style.background = "#f59e0b";
        if (manual) showToast("Offline &mdash; using saved schedule");
      }
    }

    function getHashParam(key) {
      try {
        const hash = window.location.hash.substring(1);
        const params = new URLSearchParams(hash);
        return params.get(key);
      } catch (e) {
        return null;
      }
    }

    function setHashParam(key, val) {
      const hash = window.location.hash.substring(1);
      const params = new URLSearchParams(hash);
      if (val) {
        params.set(key, val);
      } else {
        params.delete(key);
      }
      window.history.replaceState(null, "", "#" + params.toString());
    }

    function selectHandler(name) {
      if (!state.handlersMap.has(name)) return;
      state.selectedHandler = name;
      state.selectedDog = null;
      state.selectedDay = "all";
      localStorage.setItem("updog_selected_handler", name);
      setHashParam("handler", name);

      const input = document.getElementById("handlerSearch");
      input.value = name;
      document.getElementById("searchClearBtn").style.display = "block";
      closeSuggestions();

      renderSchedule();
    }

    function clearHandlerSelection() {
      state.selectedHandler = null;
      state.selectedDog = null;
      state.selectedDay = "all";
      localStorage.removeItem("updog_selected_handler");
      setHashParam("handler", null);

      const input = document.getElementById("handlerSearch");
      input.value = "";
      document.getElementById("searchClearBtn").style.display = "none";
      closeSuggestions();

      renderSchedule();
    }

    function selectDog(dogName) {
      state.selectedDog = dogName;
      renderSchedule();
    }

    function selectDay(dayName) {
      state.selectedDay = dayName;
      renderSchedule();
    }

    function renderPopularChips() {
      const container = document.getElementById("popularChips");
      if (!container) return;
      const sortedByRuns = [...state.allHandlers]
        .sort((a, b) => b.runs.length - a.runs.length)
        .slice(0, 8);

      container.innerHTML = sortedByRuns.map(h => `
        <button class="popular-chip" onclick="selectHandler('${escapeHtml(h.name)}')">
          ${escapeHtml(h.name)} (${h.runs.length})
        </button>
      `).join("");
    }

    function renderSchedule() {
      const welcome = document.getElementById("welcomeState");
      const profile = document.getElementById("profileContainer");
      const schedule = document.getElementById("scheduleContainer");

      if (!state.selectedHandler || !state.handlersMap.has(state.selectedHandler)) {
        welcome.style.display = "block";
        profile.style.display = "none";
        schedule.innerHTML = "";
        return;
      }

      welcome.style.display = "none";
      profile.style.display = "block";

      const handlerData = state.handlersMap.get(state.selectedHandler);
      const allRuns = handlerData.runs;
      const dogs = Array.from(handlerData.dogs).sort();

      // Available competition days for this handler
      const activeDays = DAY_CONFIG.filter(d => allRuns.some(r => r.day === d.name));

      // Filter runs by selected dog and selected day
      let filteredRuns = allRuns;
      if (state.selectedDog) {
        filteredRuns = filteredRuns.filter(r => r.dog === state.selectedDog);
      }
      if (state.selectedDay !== "all") {
        filteredRuns = filteredRuns.filter(r => r.day === state.selectedDay);
      }

      // Render Profile Card with Dog and Day filters
      profile.innerHTML = `
        <div class="profile-card">
          <div class="profile-header">
            <div>
              <h2 class="profile-title">${escapeHtml(handlerData.name)}</h2>
              <div class="profile-stats">
                <span class="stat-chip">${allRuns.length} Total Runs</span>
                <span class="stat-chip">${dogs.length} ${dogs.length === 1 ? "Dog" : "Dogs"}</span>
                <span class="stat-chip">${activeDays.length} Competition ${activeDays.length === 1 ? "Day" : "Days"}</span>
              </div>
            </div>
          </div>

          <div class="filter-section">
            <!-- Day Filters -->
            <div class="filter-row">
              <span class="filter-label">Day:</span>
              <button 
                class="filter-btn ${state.selectedDay === "all" ? "active" : ""}" 
                onclick="selectDay('all')"
              >
                <span>All Days</span>
                <span class="filter-count">${state.selectedDog ? allRuns.filter(r => r.dog === state.selectedDog).length : allRuns.length}</span>
              </button>
              ${activeDays.map(d => {
                const dayRuns = allRuns.filter(r => r.day === d.name && (!state.selectedDog || r.dog === state.selectedDog));
                return `
                  <button 
                    class="filter-btn ${state.selectedDay === d.name ? "active" : ""}" 
                    onclick="selectDay('${d.name}')"
                  >
                    <span>${d.name}</span>
                    <span class="filter-count">${dayRuns.length}</span>
                  </button>
                `;
              }).join("")}
            </div>

            <!-- Dog Filters (if handler has multiple dogs) -->
            ${dogs.length > 1 ? `
              <div class="filter-row">
                <span class="filter-label">Dog:</span>
                <button 
                  class="filter-btn ${state.selectedDog === null ? "active" : ""}" 
                  onclick="selectDog(null)"
                >
                  <span>All Dogs</span>
                </button>
                ${dogs.map(dog => {
                  const dogCount = allRuns.filter(r => r.dog === dog && (state.selectedDay === "all" || r.day === state.selectedDay)).length;
                  return `
                    <button 
                      class="filter-btn ${state.selectedDog === dog ? "active" : ""}" 
                      onclick="selectDog('${escapeHtml(dog)}')"
                    >
                      <span>🐾 ${escapeHtml(dog)}</span>
                      <span class="filter-count">${dogCount}</span>
                    </button>
                  `;
                }).join("")}
              </div>
            ` : ""}
          </div>
        </div>
      `;

      if (filteredRuns.length === 0) {
        schedule.innerHTML = `
          <div class="empty-state">
            <p>No runs match the current day and dog filter.</p>
          </div>
        `;
        return;
      }

      // Check conflicts per day & minute
      const dayMinuteCountMap = new Map();
      allRuns.forEach(r => {
        const key = `${r.day}_${r.minutes}`;
        dayMinuteCountMap.set(key, (dayMinuteCountMap.get(key) || 0) + 1);
      });

      // Group runs by Day
      let currentDay = null;
      let timelineHtml = "";

      for (let i = 0; i < filteredRuns.length; i++) {
        const run = filteredRuns[i];
        const prevRun = i > 0 ? filteredRuns[i - 1] : null;

        // Start new Day group
        if (run.day !== currentDay) {
          if (currentDay !== null) {
            timelineHtml += `</div>`; // Close previous timeline
          }
          currentDay = run.day;
          timelineHtml += `
            <div class="day-header">
              <span>${run.day}</span>
              <span class="day-line"></span>
            </div>
            <div class="timeline">
          `;
        }

        // Break indicator if > 45 minutes between runs on the same day
        if (prevRun && prevRun.day === run.day) {
          const gapMin = run.minutes - prevRun.minutes;
          if (gapMin >= 45) {
            const hrs = Math.floor(gapMin / 60);
            const mins = gapMin % 60;
            const gapStr = hrs > 0 ? `${hrs}h ${mins > 0 ? mins + "m" : ""}` : `${mins}m`;
            timelineHtml += `
              <div class="break-indicator">
                <span class="break-line"></span>
                <span>${gapStr} break</span>
                <span class="break-line"></span>
              </div>
            `;
          }
        }

        const formattedTime = formatMinutesToTime(run.minutes);
        const ringClass = getRingClass(run.ring);
        const conflictKey = `${run.day}_${run.minutes}`;
        const hasConflict = dayMinuteCountMap.get(conflictKey) > 1;

        timelineHtml += `
          <div class="timeline-item ${hasConflict ? "has-conflict" : ""}">
            <div class="timeline-time">
              <span class="time-val">${formattedTime.formatted}</span>
              <span class="time-period">${formattedTime.period}</span>
            </div>
            <div class="timeline-spine">
              <span class="timeline-dot"></span>
            </div>
            <div class="run-card">
              <div class="run-card-top">
                <h4 class="game-name">${escapeHtml(run.game)}</h4>
                <span class="ring-pill ${ringClass}">Ring ${escapeHtml(run.ring)}</span>
              </div>
              <div class="run-card-bottom">
                <span class="dog-tag">
                  <span>🐾</span>
                  <span>${escapeHtml(run.dog || "Unassigned")}</span>
                </span>
                ${hasConflict ? `
                  <span class="conflict-tag">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                      <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"></path>
                      <line x1="12" y1="9" x2="12" y2="13"></line>
                      <line x1="12" y1="17" x2="12.01" y2="17"></line>
                    </svg>
                    Double booked
                  </span>
                ` : ""}
              </div>
            </div>
          </div>
        `;
      }

      if (currentDay !== null) {
        timelineHtml += `</div>`;
      }

      schedule.innerHTML = timelineHtml;
    }

    function getRingClass(ring) {
      if (!ring) return "ring-1";
      const cleaned = ring.trim();
      if (cleaned === "1") return "ring-1";
      if (cleaned === "2") return "ring-2";
      if (cleaned === "3") return "ring-3";
      return "ring-23";
    }

    // Search Autocomplete Logic
    const searchInput = document.getElementById("handlerSearch");
    const suggestionsList = document.getElementById("suggestionsList");
    const clearBtn = document.getElementById("searchClearBtn");

    searchInput.addEventListener("input", (e) => {
      const q = e.target.value.trim().toLowerCase();
      clearBtn.style.display = q ? "block" : "none";

      if (!q) {
        closeSuggestions();
        return;
      }

      const matches = [];
      for (const h of state.allHandlers) {
        const handlerMatch = h.name.toLowerCase().includes(q);
        const matchingDogs = Array.from(h.dogs).filter(d => d.toLowerCase().includes(q));

        if (handlerMatch || matchingDogs.length > 0) {
          matches.push({
            name: h.name,
            runsCount: h.runs.length,
            dogs: Array.from(h.dogs),
            matchedDog: !handlerMatch && matchingDogs.length > 0 ? matchingDogs[0] : null
          });
        }
      }

      renderSuggestions(matches);
    });

    searchInput.addEventListener("focus", (e) => {
      if (e.target.value.trim()) {
        e.target.dispatchEvent(new Event("input"));
      } else {
        const top = state.allHandlers.slice(0, 10);
        renderSuggestions(top.map(h => ({
          name: h.name,
          runsCount: h.runs.length,
          dogs: Array.from(h.dogs)
        })));
      }
    });

    function renderSuggestions(items) {
      if (!items || items.length === 0) {
        suggestionsList.innerHTML = `<li class="suggestion-item"><span class="suggestion-meta">No matching handlers or dogs</span></li>`;
        suggestionsList.style.display = "block";
        return;
      }

      suggestionsList.innerHTML = items.slice(0, 15).map(item => `
        <li class="suggestion-item" onclick="selectHandler('${escapeHtml(item.name)}')">
          <div>
            <div class="suggestion-name">${escapeHtml(item.name)}</div>
            <div class="suggestion-meta">
              ${item.matchedDog ? `Matches dog: 🐾 <strong>${escapeHtml(item.matchedDog)}</strong> &bull; ` : ""}
              ${escapeHtml(item.dogs.join(", "))}
            </div>
          </div>
          <span class="suggestion-meta">${item.runsCount} runs</span>
        </li>
      `).join("");
      suggestionsList.style.display = "block";
    }

    function closeSuggestions() {
      suggestionsList.style.display = "none";
    }

    function clearSearchInput() {
      clearHandlerSelection();
    }

    document.addEventListener("click", (e) => {
      if (!e.target.closest(".search-section")) {
        closeSuggestions();
      }
    });

    function copyShareLink() {
      const url = window.location.href;
      navigator.clipboard.writeText(url).then(() => {
        showToast(state.selectedHandler ? `Link copied for ${state.selectedHandler}` : "Link copied to clipboard");
      }).catch(() => {
        showToast("Unable to copy link");
      });
    }

    function showToast(msg) {
      const toast = document.getElementById("toast");
      toast.innerHTML = msg;
      toast.classList.add("show");
      setTimeout(() => {
        toast.classList.remove("show");
      }, 2600);
    }

    function toggleTheme() {
      const cur = document.documentElement.getAttribute("data-theme");
      const next = cur === "dark" ? "light" : "dark";
      setTheme(next);
    }

    function setTheme(theme) {
      document.documentElement.setAttribute("data-theme", theme);
      localStorage.setItem("updog_theme", theme);
      document.getElementById("moonIcon").style.display = theme === "dark" ? "none" : "block";
      document.getElementById("sunIcon").style.display = theme === "dark" ? "block" : "none";
    }

    const savedTheme = localStorage.getItem("updog_theme") || 
      (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    setTheme(savedTheme);

    function escapeHtml(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    ingestScheduleData(FALLBACK_CSV, false);
    fetchLiveSchedule(false);
  </script>
</body>
</html>
