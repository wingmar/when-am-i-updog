<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0">
  <title>When Am I UpDog? &mdash; Personal Schedule</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <header>
    <div class="header-inner">
      <a href="#" class="brand" onclick="window.location.hash=''; window.location.reload(); return false;">
        <div class="brand-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"></path>
            <path d="M2 12h20"></path>
          </svg>
        </div>
        <span>When Am I UpDog?</span>
      </a>

      <div class="nav-actions">
        <span class="badge" id="syncStatus" title="Live sync status across all event sheets">
          <span class="badge-dot syncing" id="syncDot"></span>
          <span id="syncText">Syncing...</span>
        </span>

        <button class="btn-icon" id="refreshBtn" title="Sync live updates from Google Sheet">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
            <path d="M3 3v5h5"></path>
            <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"></path>
            <path d="M16 21h5v-5"></path>
          </svg>
        </button>

        <button class="btn-icon" id="shareBtn" title="Copy personal link">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path>
            <polyline points="16 6 12 2 8 6"></polyline>
            <line x1="12" y1="2" x2="12" y2="15"></line>
          </svg>
        </button>

        <button class="btn-icon" id="themeBtn" title="Toggle dark mode">
          <svg id="moonIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
          <svg id="sunIcon" style="display:none;" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        </button>
      </div>
    </div>

    <!-- Event Switcher -->
    <div class="event-bar">
      <button class="event-select-btn" id="eventSelectBtn">
        <span id="activeEventLabel">📍 Loading Event...</span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </button>

      <ul class="event-dropdown" id="eventDropdown"></ul>
    </div>
  </header>

  <main>
    <div id="loadingState" class="loading-state">
      <div class="loading-spinner"></div>
      <p id="loadingMsg">Loading running orders & block times...</p>
    </div>

    <div id="appContent" style="display: none;">
      <div class="search-section">
        <div class="search-box">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input 
            type="text" 
            id="handlerSearch" 
            class="search-input" 
            placeholder="Search handler or dog name..." 
            autocomplete="off" 
            spellcheck="false"
          >
          <button class="search-clear" id="searchClearBtn" title="Clear search">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
        <ul class="suggestions-list" id="suggestionsList"></ul>
      </div>

      <div id="profileContainer" style="display: none;"></div>
      <div id="scheduleContainer"></div>

      <div id="welcomeState" class="empty-state">
        <div class="empty-state-icon">🐾</div>
        <h3 class="empty-state-title">Select Your Name</h3>
        <p class="empty-state-subtitle">Search for your name or dog above to view your scheduled block times, block running orders, and fields.</p>
        <div class="popular-chips" id="popularChips"></div>
      </div>
    </div>
  </main>

  <div class="toast" id="toast">Link copied to clipboard</div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
